<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>No More Bets Audio Test</title>
<style>
body{background:#101010;color:white;font-family:Arial;padding:30px}
button{font-size:24px;padding:16px 24px;border-radius:12px;margin:8px;cursor:pointer}
</style>
</head>
<body>
<h1>No More Bets Audio Test</h1>
<p>Do not open the audio file directly. Open this HTML, then click the button.</p>

<audio id="noMoreBets" preload="auto">
  <source src="nomorebetsplease.mp3" type="audio/mpeg">
  <source src="nomorebetsplease.ogg" type="audio/ogg">
</audio>

<button onclick="playSound()">Play: No more bets please</button>

<script>
function playSound(){
  const a = document.getElementById("noMoreBets");
  a.currentTime = 0;
  a.volume = 1;
  a.play().catch(err => alert("Audio blocked or missing: " + err.message));
}
</script>
</body>
</html>
