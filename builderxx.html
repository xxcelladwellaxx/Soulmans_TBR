<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soulman's Strategy Builder</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: system-ui;
    }

    /* 🔥 IMPORTANT */
    .bet {
      position: relative !important;
    }

    .hint-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      border-radius: 50%;
      background: purple;
      pointer-events: none;
      animation: blink 1s infinite;
      box-shadow: 0 0 4px purple;
      z-index: 999;
    }

    .hint-dot.small { width: 4px; height: 4px; opacity: 0.6; }
    .hint-dot.medium { width: 6px; height: 6px; opacity: 0.8; }
    .hint-dot.large { width: 8px; height: 8px; opacity: 1; box-shadow: 0 0 10px violet; }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .hint-multiplier {
      position: absolute;
      top: 0px;
      right: 10px;
      font-size: 9px;
      color: violet;
      font-weight: bold;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- ⚠️ YOUR ORIGINAL REACT BUNDLE GOES HERE -->
  <!-- KEEP YOUR EXISTING SCRIPT EXACTLY AS IT WAS -->
  <!-- (paste your big script here if needed) -->

  <script>
    function removeHint(el) {
      el.querySelectorAll(".hint-dot, .hint-multiplier").forEach(e => e.remove());
    }

    function applyHint(el, strength = 1, streak = 1) {
      removeHint(el);

      const dot = document.createElement("div");

      let sizeClass = "small";
      if (strength === 2) sizeClass = "medium";
      if (strength >= 3) sizeClass = "large";

      dot.className = "hint-dot " + sizeClass;
      el.appendChild(dot);

      if (streak > 1) {
        const mult = document.createElement("div");
        mult.className = "hint-multiplier";
        mult.innerText = "x" + streak;
        el.appendChild(mult);
      }
    }

    function applyHintToAll() {
      const bets = document.querySelectorAll('[data-bet], .bet');

      bets.forEach(el => {
        // TEMP TEST LOGIC (you’ll replace this later)
        if (Math.random() < 0.2) {
          const strength = Math.floor(Math.random() * 3) + 1;
          const streak = Math.floor(Math.random() * 4);
          applyHint(el, strength, streak);
        } else {
          removeHint(el);
        }
      });
    }

    // 🔥 React-safe observer
    const observer = new MutationObserver(() => {
      applyHintToAll();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    // run once after load
    setTimeout(() => {
      applyHintToAll();
    }, 1000);
  </script>
</body>
</html>
