<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOMBAY! — Soulman's Roulette HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a28;
      --border: rgba(255,255,255,0.06);
      --border-active: rgba(251,191,36,0.3);
      --amber: #f59e0b;
      --amber-dim: #92400e;
      --emerald: #10b981;
      --red: #ef4444;
      --indigo: #6366f1;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --text-muted: #334155;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* === HEADER === */
    .header {
      background: linear-gradient(135deg, #1a0f00 0%, #0a0a0f 50%, #0f0a1a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .header-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #f59e0b, #fbbf24, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(245,158,11,0.3);
    }
    .header-sub {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-pill {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid;
    }
    .status-active { background: rgba(16,185,129,0.1); color: #10b981; border-color: rgba(16,185,129,0.3); }
    .status-paused { background: rgba(245,158,11,0.1); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .status-locked { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.3); }
    .status-walk { background: rgba(168,85,247,0.15); color: #a855f7; border-color: rgba(168,85,247,0.4); animation: pulse-walk 1s infinite; }
    @keyframes pulse-walk { 0%,100%{opacity:1} 50%{opacity:0.6} }

    /* === LAYOUT === */
    .main { 
      display: grid; 
      grid-template-columns: 1fr 320px; 
      gap: 16px; 
      padding: 16px 24px; 
      max-width: 1400px; 
      margin: 0 auto;
    }
    @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

    /* === PANELS === */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.01);
    }
    .panel-label {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--amber);
    }
    .panel-body { padding: 16px; }

    /* === WHEEL INPUT === */
    .wheel-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }
    .wheel-btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-btn:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .wheel-btn:active { transform: scale(0.95); }
    .wheel-btn.green { background: #15803d; }
    .wheel-btn.red { background: #b91c1c; }
    .wheel-btn.black { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); }
    .wheel-btn.snipe { box-shadow: 0 0 12px rgba(245,158,11,0.4); outline: 2px solid var(--amber); outline-offset: 1px; }
    .wheel-btn.last-hit { box-shadow: 0 0 0 3px var(--emerald), 0 0 20px rgba(16,185,129,0.4); }

    /* === HUD === */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .hud-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .hud-card.bankroll {
      grid-column: span 3;
      background: linear-gradient(135deg, rgba(245,158,11,0.05), rgba(245,158,11,0.02));
      border-color: rgba(245,158,11,0.15);
    }
    .hud-label {
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .hud-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 22px;
    }
    .hud-value.bankroll-val {
      font-size: 36px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hud-value.small { font-size: 16px; }

    /* === BETS DISPLAY === */
    .bet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      transition: all 0.2s;
    }
    .bet-row.active { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .bet-row.waiting { border-color: rgba(245,158,11,0.2); background: rgba(245,158,11,0.03); opacity: 0.6; }
    .bet-row.disabled { border-color: rgba(239,68,68,0.15); background: rgba(239,68,68,0.03); opacity: 0.4; }
    .bet-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .bet-amount { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 16px; }
    .bet-amount.green { color: var(--emerald); }
    .bet-amount.amber { color: var(--amber); }
    .bet-amount.red { color: var(--red); }

    /* === HISTORY === */
    .history-track {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(99,102,241,0.3) transparent;
    }
    .history-chip {
      min-width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      color: white;
      flex-shrink: 0;
    }
    .history-chip.green { background: #15803d; }
    .history-chip.red { background: #b91c1c; }
    .history-chip.black { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); }

    /* === COMMAND ALERTS === */
    .command-alert {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      animation: fadeSlide 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    @keyframes fadeSlide { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
    .command-alert.warn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }
    .command-alert.danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .command-alert.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .command-alert.walk { background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(236,72,153,0.1)); border: 1px solid rgba(168,85,247,0.4); color: #e9d5ff; animation: pulse-walk 0.8s infinite; }
    .command-icon { font-size: 18px; }

    /* === DOZEN MISS BARS === */
    .miss-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .miss-label { font-size: 10px; font-weight: 800; color: var(--text-dim); width: 28px; }
    .miss-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .miss-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .miss-fill.cold { background: linear-gradient(90deg, #3b82f6, #6366f1); }
    .miss-fill.hot { background: linear-gradient(90deg, #f59e0b, #ef4444); }
    .miss-fill.ready { background: linear-gradient(90deg, #10b981, #34d399); animation: pulse-glow 1s infinite; }
    @keyframes pulse-glow { 0%,100%{opacity:1;box-shadow:none} 50%{opacity:0.8;box-shadow:0 0 10px rgba(16,185,129,0.5)} }
    .miss-count { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 12px; width: 20px; text-align: right; }

    /* === PROGRESSION DISPLAY === */
    .prog-steps {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-wrap: wrap;
    }
    .prog-step {
      padding: 3px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .prog-step.current { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: var(--amber); box-shadow: 0 0 10px rgba(245,158,11,0.2); }
    .prog-step.done { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); color: #6ee7b7; }

    /* === BUTTONS === */
    .btn-reset {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reset:hover { background: rgba(239,68,68,0.2); }

    .btn-undo {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-undo:hover { background: rgba(99,102,241,0.2); }

    /* === SMART PAUSE OVERLAY === */
    .pause-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .pause-box {
      background: var(--surface);
      border: 2px solid rgba(245,158,11,0.4);
      border-radius: 24px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 0 80px rgba(245,158,11,0.15);
    }
    .pause-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--amber);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .pause-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
    .pause-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 64px;
      font-weight: 900;
      color: white;
    }

    /* Spin counter */
    .spin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      color: #a5b4fc;
    }

    /* === AUTO-SIM CONTROLS === */
    .sim-bar {
      background: linear-gradient(135deg, rgba(16,185,129,0.06), rgba(99,102,241,0.06));
      border: 1px solid rgba(16,185,129,0.15);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sim-btn {
      padding: 7px 18px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid;
      font-family: 'Inter', sans-serif;
    }
    .sim-btn:hover { transform: scale(1.03); }
    .sim-btn:active { transform: scale(0.97); }
    .sim-btn.play { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #6ee7b7; }
    .sim-btn.play:hover { background: rgba(16,185,129,0.25); }
    .sim-btn.stop { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .sim-btn.batch { background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.4); color: #d8b4fe; }
    .sim-btn.batch:hover { background: rgba(168,85,247,0.25); }
    .sim-btn.active-speed { background: rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.5); color: #fbbf24; }
    .sim-btn.speed { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); color: var(--text-dim); }
    .sim-btn.speed:hover { border-color: rgba(245,158,11,0.3); color: var(--amber); }
    .sim-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.08); margin: 0 4px; }
    .sim-label { font-size: 7px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }

    /* === BATCH STATS === */
    .batch-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .batch-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .batch-card.highlight { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .batch-card.warn-hl { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .batch-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 18px;
    }

    /* === SPARKLINE === */
    .sparkline-container {
      width: 100%;
      height: 80px;
      background: var(--surface2);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .sparkline-container canvas { display: block; width: 100%; height: 100%; }
    .sparkline-labels {
      position: absolute;
      top: 4px; right: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ===== BOMBAY! STRATEGY ENGINE =====
const RED_NUMBERS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const PROGRESSION = [5, 5, 5, 10, 15, 25, 40, 65, 105];
const STARTING_BANKROLL = 1200;
const FLOOR = 850;
const GOAL = 1500;

// Profit Lock thresholds
const LOCK_STOP_SNIPES = 1350;
const LOCK_FLAT_DOZENS = 1425;
const LOCK_ZERO_ONLY = 1475;
const LOCK_WALK = 1500;

const state = {
  bankroll: STARTING_BANKROLL,
  history: [],  // Array of winning numbers
  dozenMiss: { D1: 0, D2: 0, D3: 0 },
  activeDozen: null,       // Which dozen is progressing: 'D1','D2','D3' or null
  activeDozenStep: 0,      // Index into PROGRESSION for the active dozen
  secondDozen: null,       // Second active dozen (flat $5)
  consecutiveBothLoss: 0,  // Track consecutive losses on BOTH active dozens
  smartPauseSpins: 0,      // Spins to wait during smart pause
  spinsSinceZero: 0,       // Spins since any zero hit
  spinCount: 0,
  sessionOver: false,
  commands: [],            // Active command alerts
  profitLockLevel: 0,      // 0=none, 1=stop snipes, 2=flat dozens, 3=zero only, 4=WALK
};

// Auto-sim state
const sim = {
  running: false,
  intervalId: null,
  speed: 100,            // ms between spins
  bankrollTrack: [],     // bankroll after each spin
  // Batch mode
  batchRunning: false,
  batchTotal: 100,
  batchDone: 0,
  batchResults: [],      // array of { finalBankroll, spins, result: 'win'|'bust'|'max' }
  maxSpins: 500,         // max spins per session before forced stop
};

// American wheel pocket pool
const WHEEL_POCKETS = [0, -1, ...Array.from({length: 36}, (_, i) => i + 1)];

function spinWheel() {
  return WHEEL_POCKETS[Math.floor(Math.random() * WHEEL_POCKETS.length)];
}

function startAutoSim() {
  if (sim.running || state.sessionOver) return;
  sim.running = true;
  sim.bankrollTrack = [...(sim.bankrollTrack.length ? sim.bankrollTrack : [state.bankroll])];
  runAutoTick();
}

function runAutoTick() {
  if (!sim.running || state.sessionOver) {
    stopAutoSim();
    return;
  }
  // Floor check — auto stop
  if (state.bankroll <= FLOOR) {
    state.sessionOver = true;
    state.commands = [{ type: 'danger', text: '💀 BANKROLL HIT FLOOR. Session terminated.' }];
    stopAutoSim();
    render();
    return;
  }
  // Max spins guard
  if (state.spinCount >= sim.maxSpins) {
    state.sessionOver = true;
    state.commands = [{ type: 'warn', text: `⏱️ MAX SPINS (${sim.maxSpins}) REACHED. Session ended.` }];
    stopAutoSim();
    render();
    return;
  }
  const num = spinWheel();
  processNumber(num);
  sim.bankrollTrack.push(state.bankroll);
  // Keep track limited for performance
  if (sim.bankrollTrack.length > 600) sim.bankrollTrack = sim.bankrollTrack.slice(-500);
  if (!state.sessionOver && sim.running) {
    sim.intervalId = setTimeout(runAutoTick, sim.speed);
  } else {
    stopAutoSim();
  }
}

function stopAutoSim() {
  sim.running = false;
  if (sim.intervalId) { clearTimeout(sim.intervalId); sim.intervalId = null; }
  render();
}

function setSimSpeed(ms) {
  sim.speed = ms;
  render();
}

// === BATCH RUNNER ===
function startBatch(count) {
  sim.batchTotal = count;
  sim.batchDone = 0;
  sim.batchResults = [];
  sim.batchRunning = true;
  render();
  runBatchSession();
}

function runBatchSession() {
  if (sim.batchDone >= sim.batchTotal) {
    sim.batchRunning = false;
    render();
    return;
  }
  // Reset for new session
  resetStateQuiet();
  // Run entire session synchronously (fast)
  let spins = 0;
  while (!state.sessionOver && state.bankroll > FLOOR && spins < sim.maxSpins) {
    processNumberQuiet(spinWheel());
    spins++;
  }
  const result = state.bankroll >= GOAL ? 'win' : state.bankroll <= FLOOR ? 'bust' : 'max';
  sim.batchResults.push({ finalBankroll: state.bankroll, spins, result });
  sim.batchDone++;
  // Update UI every few sessions
  if (sim.batchDone % 5 === 0 || sim.batchDone === sim.batchTotal) render();
  // Yield to UI
  if (sim.batchDone < sim.batchTotal) {
    setTimeout(runBatchSession, 0);
  } else {
    sim.batchRunning = false;
    render();
  }
}

function resetStateQuiet() {
  state.bankroll = STARTING_BANKROLL;
  state.history = [];
  state.dozenMiss = { D1: 0, D2: 0, D3: 0 };
  state.activeDozen = null;
  state.activeDozenStep = 0;
  state.secondDozen = null;
  state.consecutiveBothLoss = 0;
  state.smartPauseSpins = 0;
  state.spinsSinceZero = 0;
  state.spinCount = 0;
  state.sessionOver = false;
  state.commands = [];
  state.profitLockLevel = 0;
}

// Quiet version of processNumber — no render calls
function processNumberQuiet(num) {
  if (state.sessionOver) return;
  state.spinCount++;
  state.history.push(num);
  state.commands = [];
  if (num === 0 || num === -1) { state.spinsSinceZero = 0; } else { state.spinsSinceZero++; }
  const hitDozen = getDozen(num);
  ['D1', 'D2', 'D3'].forEach(d => { if (d === hitDozen) { state.dozenMiss[d] = 0; } else { state.dozenMiss[d]++; } });
  if (state.smartPauseSpins > 0) {
    state.smartPauseSpins--;
    let pc = 0, pw = 0;
    if (state.spinsSinceZero >= 12) { pc += 2; if (num === 0 || num === -1) pw += 35; }
    if (state.profitLockLevel < 1) { pc += 4; if (num === 8) pw += 70; if (num === 17) pw += 70; }
    state.bankroll -= pc; state.bankroll += pw;
    checkProfitLocksQuiet(); return;
  }
  let tb = 0, tw = 0;
  if (state.profitLockLevel >= 4) { state.sessionOver = true; return; }
  if (state.profitLockLevel >= 3) { tb += 2; if (num === 0 || num === -1) tw += 35; state.bankroll -= tb; state.bankroll += tw; checkProfitLocksQuiet(); return; }
  let candidates = ['D1','D2','D3'].filter(d => state.dozenMiss[d] >= 4);
  if (state.activeDozen && hitDozen === state.activeDozen) state.activeDozenStep = 0;
  if (!state.activeDozen && candidates.length > 0) { candidates.sort((a,b) => state.dozenMiss[b] - state.dozenMiss[a]); state.activeDozen = candidates[0]; state.activeDozenStep = 0; }
  if (state.activeDozen && !state.secondDozen) { const s = candidates.find(d => d !== state.activeDozen && state.dozenMiss[d] >= 4); if (s) state.secondDozen = s; }
  if (state.activeDozen && state.dozenMiss[state.activeDozen] === 0 && hitDozen === state.activeDozen) state.activeDozenStep = 0;
  if (state.profitLockLevel >= 2) { tb += 6; if (hitDozen) tw += 6; tb += 2; if (num === 0 || num === -1) tw += 35; state.bankroll -= tb; state.bankroll += tw; checkProfitLocksQuiet(); return; }
  let db1=0,db2=0,db3=0,a1=false,a2=false,a3=false;
  if (state.activeDozen && state.dozenMiss[state.activeDozen] >= 4) { const amt = PROGRESSION[Math.min(state.activeDozenStep, PROGRESSION.length-1)]; if (state.activeDozen==='D1'){db1=amt;a1=true;} if (state.activeDozen==='D2'){db2=amt;a2=true;} if (state.activeDozen==='D3'){db3=amt;a3=true;} }
  if (state.secondDozen && state.dozenMiss[state.secondDozen] >= 4) { if (state.secondDozen==='D1'&&!a1){db1=5;a1=true;} if (state.secondDozen==='D2'&&!a2){db2=5;a2=true;} if (state.secondDozen==='D3'&&!a3){db3=5;a3=true;} }
  tb += db1+db2+db3;
  if (hitDozen==='D1'&&db1>0) tw+=db1*3; if (hitDozen==='D2'&&db2>0) tw+=db2*3; if (hitDozen==='D3'&&db3>0) tw+=db3*3;
  if (state.activeDozen) { if (hitDozen===state.activeDozen){state.activeDozenStep=0;state.consecutiveBothLoss=0;} else if(db1>0||db2>0||db3>0){if(state.dozenMiss[state.activeDozen]>=4) state.activeDozenStep=Math.min(state.activeDozenStep+1,PROGRESSION.length-1);} }
  if (state.activeDozen && state.secondDozen) { if (hitDozen!==state.activeDozen&&hitDozen!==state.secondDozen&&(a1||a2||a3)){state.consecutiveBothLoss++;}else{state.consecutiveBothLoss=0;} if(state.consecutiveBothLoss>=2){state.smartPauseSpins=2;state.consecutiveBothLoss=0;} }
  if (state.profitLockLevel < 1) { tb += 4; if (num===8) tw+=70; if (num===17) tw+=70; }
  if (state.spinsSinceZero >= 12) { tb += 2; if (num===0||num===-1) tw+=35; }
  state.bankroll -= tb; state.bankroll += tw;
  if (hitDozen===state.activeDozen&&state.activeDozen) state.activeDozenStep=0;
  checkProfitLocksQuiet();
  if (state.bankroll <= FLOOR) state.sessionOver = true;
}

function checkProfitLocksQuiet() {
  if (state.bankroll >= LOCK_WALK) { state.profitLockLevel = 4; state.sessionOver = true; }
  else if (state.bankroll >= LOCK_ZERO_ONLY) { state.profitLockLevel = 3; }
  else if (state.bankroll >= LOCK_FLAT_DOZENS) { state.profitLockLevel = 2; }
  else if (state.bankroll >= LOCK_STOP_SNIPES) { state.profitLockLevel = 1; }
}

function drawSparkline() {
  const canvas = document.getElementById('sparkline');
  if (!canvas || sim.bankrollTrack.length < 2) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0,0,w,h);
  const data = sim.bankrollTrack;
  const minV = Math.min(...data, FLOOR);
  const maxV = Math.max(...data, GOAL);
  const range = maxV - minV || 1;
  const stepX = w / (data.length - 1);
  // Floor line
  const floorY = h - ((FLOOR - minV) / range) * h;
  ctx.strokeStyle = 'rgba(239,68,68,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(w, floorY); ctx.stroke(); ctx.setLineDash([]);
  // Goal line
  const goalY = h - ((GOAL - minV) / range) * h;
  ctx.strokeStyle = 'rgba(16,185,129,0.3)'; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0, goalY); ctx.lineTo(w, goalY); ctx.stroke(); ctx.setLineDash([]);
  // Start line
  const startY = h - ((STARTING_BANKROLL - minV) / range) * h;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.setLineDash([2,4]);
  ctx.beginPath(); ctx.moveTo(0, startY); ctx.lineTo(w, startY); ctx.stroke(); ctx.setLineDash([]);
  // Data line
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i * stepX;
    const y = h - ((v - minV) / range) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  const lastVal = data[data.length - 1];
  ctx.strokeStyle = lastVal >= STARTING_BANKROLL ? '#10b981' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Glow fill
  const lastX = (data.length-1)*stepX;
  const lastY = h - ((lastVal - minV) / range) * h;
  ctx.lineTo(lastX, h); ctx.lineTo(0, h); ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, lastVal >= STARTING_BANKROLL ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fill();
}

function getDozen(num) {
  if (num >= 1 && num <= 12) return 'D1';
  if (num >= 13 && num <= 24) return 'D2';
  if (num >= 25 && num <= 36) return 'D3';
  return null;
}

function getColor(num) {
  if (num === 0 || num === -1) return 'green';
  return RED_NUMBERS.includes(num) ? 'red' : 'black';
}

function displayNum(num) {
  if (num === -1) return '00';
  return String(num);
}

function processNumber(num) {
  if (state.sessionOver) return;

  state.spinCount++;
  state.history.push(num);
  state.commands = [];

  // Track zero spins
  if (num === 0 || num === -1) {
    state.spinsSinceZero = 0;
  } else {
    state.spinsSinceZero++;
  }

  const hitDozen = getDozen(num);

  // Update miss counts
  ['D1', 'D2', 'D3'].forEach(d => {
    if (d === hitDozen) {
      state.dozenMiss[d] = 0;
    } else {
      state.dozenMiss[d]++;
    }
  });

  // Check if we're in smart pause
  if (state.smartPauseSpins > 0) {
    state.smartPauseSpins--;
    // Calculate cost: zero hedge + snipes still apply during pause? 
    // The rules say "wait 2 spins before betting" — so no dozen bets during pause
    // But zero hedge and snipes are separate bets, let's apply those
    let pauseCost = 0;
    // Zero hedge during pause if active
    if (state.spinsSinceZero >= 12 || state.profitLockLevel >= 3) {
      pauseCost += 2; // $1 each on 0 and 00
    }
    // Snipes during pause
    if (state.profitLockLevel < 1) {
      pauseCost += 4; // $2 each on 8 and 17
    }
    // Did we win anything during pause?
    let pauseWin = 0;
    if ((num === 0 || num === -1) && (state.spinsSinceZero === 0 || state.profitLockLevel >= 3)) {
      pauseWin += 35; // $1 * 35
    }
    if ((num === 8 || num === 17) && state.profitLockLevel < 1) {
      pauseWin += 70; // $2 * 35
    }
    state.bankroll -= pauseCost;
    state.bankroll += pauseWin;
    checkProfitLocks();
    render();
    return;
  }

  // === Calculate bets placed this spin ===
  let totalBet = 0;
  let totalWin = 0;

  // PROFIT LOCK LEVEL 4: WALK — should not even be here
  if (state.profitLockLevel >= 4) {
    state.sessionOver = true;
    state.commands.push({ type: 'walk', text: '🚪 STOP IMMEDIATELY AND WALK. YOU REACHED $1500!' });
    render();
    return;
  }

  // PROFIT LOCK LEVEL 3: Only zero hedge
  if (state.profitLockLevel >= 3) {
    totalBet += 2; // $1 on 0 and $1 on 00
    if (num === 0 || num === -1) totalWin += 35;
    state.bankroll -= totalBet;
    state.bankroll += totalWin;
    state.commands.push({ type: 'warn', text: '🔒 LOCK LEVEL 3: Zero hedge only. All other bets OFF.' });
    checkProfitLocks();
    render();
    return;
  }

  // === DOZEN BETS ===
  // Check pivot triggers — a dozen becomes "active" after missing 4+ spins
  let activeDozens = [];
  ['D1', 'D2', 'D3'].forEach(d => {
    if (state.dozenMiss[d] >= 4 || d === state.activeDozen || d === state.secondDozen) {
      // Eligible to bet
    }
  });

  // Determine which dozens to bet on
  // Dozens that have missed 4+ are candidates
  let candidates = ['D1', 'D2', 'D3'].filter(d => state.dozenMiss[d] >= 4);
  
  // If we already have an active dozen that just won, reset it
  if (state.activeDozen && hitDozen === state.activeDozen) {
    state.activeDozenStep = 0; // Reset progression on win
  }
  if (state.secondDozen && hitDozen === state.secondDozen) {
    // Second dozen won — stays flat
  }

  // Assign active dozens if not set
  if (!state.activeDozen && candidates.length > 0) {
    // Pick the one with highest miss count
    candidates.sort((a, b) => state.dozenMiss[b] - state.dozenMiss[a]);
    state.activeDozen = candidates[0];
    state.activeDozenStep = 0;
  }
  if (!state.secondDozen && candidates.length > 1) {
    const second = candidates.find(d => d !== state.activeDozen && state.dozenMiss[d] >= 4);
    if (second) state.secondDozen = second;
  }

  // Also assign second if active already set but second not
  if (state.activeDozen && !state.secondDozen) {
    const second = candidates.find(d => d !== state.activeDozen && state.dozenMiss[d] >= 4);
    if (second) state.secondDozen = second;
  }

  // If active dozen has been hit (miss count < 4 and it's not currently active in progression)
  // We keep a dozen as "active" once triggered, until it wins
  // Deactivate dozens that have been hitting regularly
  if (state.activeDozen && state.dozenMiss[state.activeDozen] === 0 && hitDozen === state.activeDozen) {
    // Just won — reset progression, keep tracking
    state.activeDozenStep = 0;
  }

  // PROFIT LOCK LEVEL 2: Flat $2 on all dozens, no progression
  if (state.profitLockLevel >= 2) {
    // $2 flat on each dozen
    totalBet += 6; // $2 * 3 dozens
    if (hitDozen) totalWin += 6; // $2 * 3 = $6 payout on dozen win

    // Snipes (already stopped at level 1)
    // Zero hedge
    totalBet += 2;
    if (num === 0 || num === -1) totalWin += 35;

    state.bankroll -= totalBet;
    state.bankroll += totalWin;
    state.commands.push({ type: 'warn', text: '🔒 LOCK LEVEL 2: All dozens flat $2. No progression.' });
    checkProfitLocks();
    render();
    return;
  }

  // === Normal betting mode ===
  let dozenBetD1 = 0, dozenBetD2 = 0, dozenBetD3 = 0;
  let d1Active = false, d2Active = false, d3Active = false;

  // Active dozen gets progression amount
  if (state.activeDozen && state.dozenMiss[state.activeDozen] >= 4) {
    const amount = PROGRESSION[Math.min(state.activeDozenStep, PROGRESSION.length - 1)];
    if (state.activeDozen === 'D1') { dozenBetD1 = amount; d1Active = true; }
    if (state.activeDozen === 'D2') { dozenBetD2 = amount; d2Active = true; }
    if (state.activeDozen === 'D3') { dozenBetD3 = amount; d3Active = true; }
  }

  // Second dozen stays flat $5
  if (state.secondDozen && state.dozenMiss[state.secondDozen] >= 4) {
    if (state.secondDozen === 'D1' && !d1Active) { dozenBetD1 = 5; d1Active = true; }
    if (state.secondDozen === 'D2' && !d2Active) { dozenBetD2 = 5; d2Active = true; }
    if (state.secondDozen === 'D3' && !d3Active) { dozenBetD3 = 5; d3Active = true; }
  }

  totalBet += dozenBetD1 + dozenBetD2 + dozenBetD3;

  // Dozen wins
  let dozenWon = false;
  if (hitDozen === 'D1' && dozenBetD1 > 0) { totalWin += dozenBetD1 * 3; dozenWon = true; }
  if (hitDozen === 'D2' && dozenBetD2 > 0) { totalWin += dozenBetD2 * 3; dozenWon = true; }
  if (hitDozen === 'D3' && dozenBetD3 > 0) { totalWin += dozenBetD3 * 3; dozenWon = true; }

  // Handle progression on win/loss for active dozen
  if (state.activeDozen) {
    if (hitDozen === state.activeDozen) {
      // WIN on progressing dozen → reset
      state.activeDozenStep = 0;
      state.consecutiveBothLoss = 0;
    } else if (dozenBetD1 > 0 || dozenBetD2 > 0 || dozenBetD3 > 0) {
      // Active dozen lost — advance progression
      if (state.dozenMiss[state.activeDozen] >= 4) {
        state.activeDozenStep = Math.min(state.activeDozenStep + 1, PROGRESSION.length - 1);
      }
    }
  }

  // Smart Pause check: both active dozens lost?
  if (state.activeDozen && state.secondDozen) {
    if (hitDozen !== state.activeDozen && hitDozen !== state.secondDozen &&
        (d1Active || d2Active || d3Active)) {
      state.consecutiveBothLoss++;
    } else {
      state.consecutiveBothLoss = 0;
    }
    if (state.consecutiveBothLoss >= 2) {
      state.smartPauseSpins = 2;
      state.consecutiveBothLoss = 0;
      state.commands.push({ type: 'warn', text: '⏸️ SMART PAUSE: 2 consecutive both-dozen losses. Wait 2 spins.' });
    }
  }

  // Number Snipes: $2 on 8 and $2 on 17
  if (state.profitLockLevel < 1) {
    totalBet += 4; // $2 + $2
    if (num === 8) totalWin += 70;  // $2 * 35
    if (num === 17) totalWin += 70; // $2 * 35
  }

  // Zero Hedge: $1 on 0 and $1 on 00 (always active, or after 12 spins)
  if (state.spinsSinceZero >= 12 || state.profitLockLevel >= 3) {
    totalBet += 2;
    if (num === 0 || num === -1) totalWin += 35;
  }

  // Apply to bankroll
  state.bankroll -= totalBet;
  state.bankroll += totalWin;

  // Reset dozen tracking if it wins
  if (hitDozen === state.activeDozen && state.activeDozen) {
    // Keep it tracked but reset step
    state.activeDozenStep = 0;
  }
  if (hitDozen === state.secondDozen && state.secondDozen) {
    // Nothing special, stays flat
  }

  // Deactivate dozens that have miss count reset to 0 (they just hit)
  // Only deactivate if the dozen has hit and its miss count goes below trigger threshold  
  // Actually per the rules, once triggered we keep betting. Let's keep them active.
  // But if a dozen starts hitting consistently, we might want to swap. For simplicity,
  // we clear a dozen slot if it has miss count 0 and the other has higher miss.

  checkProfitLocks();
  

  // Floor check
  if (state.bankroll <= FLOOR) {
    state.commands.push({ type: 'danger', text: `💀 BANKROLL HIT FLOOR ($${FLOOR}). Consider stopping.` });
  }

  render();
}

function checkProfitLocks() {
  const prev = state.profitLockLevel;
  
  if (state.bankroll >= LOCK_WALK) {
    state.profitLockLevel = 4;
    state.sessionOver = true;
    state.commands.push({ type: 'walk', text: '🚪 GOAL REACHED! STOP IMMEDIATELY AND WALK!' });
  } else if (state.bankroll >= LOCK_ZERO_ONLY) {
    state.profitLockLevel = 3;
    if (prev < 3) state.commands.push({ type: 'danger', text: '🔒 $1475 REACHED: Stop ALL bets except $1 0/00 hedge!' });
  } else if (state.bankroll >= LOCK_FLAT_DOZENS) {
    state.profitLockLevel = 2;
    if (prev < 2) state.commands.push({ type: 'warn', text: '🔒 $1425 REACHED: Drop all dozens to flat $2, no progression!' });
  } else if (state.bankroll >= LOCK_STOP_SNIPES) {
    state.profitLockLevel = 1;
    if (prev < 1) state.commands.push({ type: 'success', text: '🔒 $1350 REACHED: STOP Number Snipes (8 & 17)!' });
  }
}

function undoLast() {
  if (state.history.length === 0) return;
  // Full reset and replay all but last
  const histCopy = [...state.history];
  histCopy.pop();
  resetState();
  histCopy.forEach(n => processNumber(n));
}

function resetState() {
  state.bankroll = STARTING_BANKROLL;
  state.history = [];
  state.dozenMiss = { D1: 0, D2: 0, D3: 0 };
  state.activeDozen = null;
  state.activeDozenStep = 0;
  state.secondDozen = null;
  state.consecutiveBothLoss = 0;
  state.smartPauseSpins = 0;
  state.spinsSinceZero = 0;
  state.spinCount = 0;
  state.sessionOver = false;
  state.commands = [];
  state.profitLockLevel = 0;
  render();
}

            <button style="font-size:8px;color:var(--text-dim);background:none;border:1px solid var(--border);padding:3px 8px;border-radius:4px;cursor:pointer;font-weight:700" onclick="sim.batchResults=[];render()">Clear</button>
          </div>
          <div class="panel-body">
            <div class="batch-grid">
              <div class="batch-card highlight">
                <div class="hud-label">Win Rate</div>
                <div class="batch-val" style="color:var(--emerald)">${(sim.batchResults.filter(r=>r.result==='win').length / sim.batchResults.length * 100).toFixed(1)}%</div>
              </div>
              <div class="batch-card warn-hl">
                <div class="hud-label">Bust Rate</div>
                <div class="batch-val" style="color:var(--red)">${(sim.batchResults.filter(r=>r.result==='bust').length / sim.batchResults.length * 100).toFixed(1)}%</div>
              </div>
              <div class="batch-card">
                <div class="hud-label">Avg Final $</div>
                <div class="batch-val" style="color:${(sim.batchResults.reduce((s,r)=>s+r.finalBankroll,0)/sim.batchResults.length) >= STARTING_BANKROLL ? 'var(--emerald)':'var(--red)'}">
                  $${Math.round(sim.batchResults.reduce((s,r)=>s+r.finalBankroll,0)/sim.batchResults.length)}
                </div>
              </div>
              <div class="batch-card">
                <div class="hud-label">Avg Spins</div>
                <div class="batch-val" style="color:var(--text)">${Math.round(sim.batchResults.reduce((s,r)=>s+r.spins,0)/sim.batchResults.length)}</div>
              </div>
            </div>
            <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--emerald)"></div><span style="font-size:8px;color:var(--text-dim);font-weight:700">Win ($${ GOAL}+): ${sim.batchResults.filter(r=>r.result==='win').length}</span></div>
              <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--red)"></div><span style="font-size:8px;color:var(--text-dim);font-weight:700">Bust (≤$${FLOOR}): ${sim.batchResults.filter(r=>r.result==='bust').length}</span></div>
              <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--amber)"></div><span style="font-size:8px;color:var(--text-dim);font-weight:700">Max Spins: ${sim.batchResults.filter(r=>r.result==='max').length}</span></div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- COMMAND ALERTS -->
        ${state.commands.map(c => `
          <div class="command-alert ${c.type}">
            <span class="command-icon">${c.text.split(' ')[0]}</span>
            <span>${c.text.substring(c.text.indexOf(' ') + 1)}</span>
          </div>
        `).join('')}

        <!-- SPARKLINE CHART -->
        ${sim.bankrollTrack.length > 1 ? `
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Bankroll Chart</span>
            <span style="font-size:9px;color:var(--text-dim)">${sim.bankrollTrack.length} pts</span>
          </div>
          <div class="panel-body" style="padding:8px">
            <div class="sparkline-container">
              <canvas id="sparkline"></canvas>
              <div class="sparkline-labels">$${state.bankroll}</div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- WHEEL INPUT -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Manual Entry</span>
            ${lastNum !== null ? `<span style="font-size:10px;color:var(--text-dim)">Last: <strong style="color:white">${displayNum(lastNum)}</strong></span>` : ''}
          </div>
          <div class="panel-body">
            <div class="wheel-grid">
              ${wheelNumbers.map(n => {
                const col = getColor(n);
                const isSnipe = (n === 8 || n === 17) && state.profitLockLevel < 1;
                const isLast = n === lastNum;
                return `<button class="wheel-btn ${col} ${isSnipe ? 'snipe' : ''} ${isLast ? 'last-hit' : ''}" 
                  onclick="processNumber(${n});sim.bankrollTrack.push(state.bankroll);render()" ${state.sessionOver||sim.running ? 'disabled' : ''}>
                  ${displayNum(n)}
                </button>`;
              }).join('')}
            </div>
          </div>
        </div>

        <!-- HISTORY -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Spin History</span>
            <span style="font-size:9px;color:var(--text-dim)">${state.history.length} spins</span>
          </div>
          <div class="panel-body" style="padding:8px 16px;">
            <div class="history-track">
              ${state.history.length === 0 ? '<span style="font-size:10px;color:var(--text-muted);font-weight:700">No spins recorded yet</span>' :
                [...state.history].reverse().slice(0, 40).map(n => 
                  `<div class="history-chip ${getColor(n)}">${displayNum(n)}</div>`
                ).join('')}
            </div>
          </div>
        </div>

        <!-- DOZEN MISS TRACKER -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Dozen Miss Tracker</span>
            <span style="font-size:9px;color:var(--text-dim)">Pivot at 4+</span>
          </div>
          <div class="panel-body">
            ${['D1', 'D2', 'D3'].map(d => {
              const miss = state.dozenMiss[d];
              const pct = Math.min(miss / 8, 1) * 100;
              const fillClass = miss >= 4 ? 'ready' : miss >= 3 ? 'hot' : 'cold';
              const isActive = d === state.activeDozen;
              const isSecond = d === state.secondDozen;
              return `<div class="miss-bar">
                <span class="miss-label" style="${isActive ? 'color:var(--amber)' : isSecond ? 'color:var(--emerald)' : ''}">${d}</span>
                <div class="miss-track"><div class="miss-fill ${fillClass}" style="width:${pct}%"></div></div>
                <span class="miss-count" style="color:${miss >= 4 ? 'var(--emerald)' : miss >= 3 ? 'var(--amber)' : 'var(--text-dim)'}">${miss}</span>
                ${isActive ? '<span style="font-size:7px;color:var(--amber);font-weight:800;margin-left:4px">▲</span>' : ''}
                ${isSecond ? '<span style="font-size:7px;color:var(--emerald);font-weight:800;margin-left:4px">●</span>' : ''}
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- PROGRESSION -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Progression Ladder</span>
            <span style="font-size:9px;color:var(--text-dim)">${state.activeDozen || 'NONE'}</span>
          </div>
          <div class="panel-body">
            <div class="prog-steps">
              ${PROGRESSION.map((v, i) => {
                let cls = '';
                if (state.activeDozen) {
                  if (i < state.activeDozenStep) cls = 'done';
                  else if (i === state.activeDozenStep) cls = 'current';
                }
                return `<div class="prog-step ${cls}">$${v}</div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDEBAR -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- HUD -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">HUD</span>
          </div>
          <div class="panel-body">
            <div class="hud-grid">
              <div class="hud-card bankroll">
                <div class="hud-label">Bankroll</div>
                <div class="hud-value bankroll-val" style="color:${state.bankroll >= STARTING_BANKROLL ? 'var(--emerald)' : state.bankroll <= FLOOR ? 'var(--red)' : ''}">$${state.bankroll.toLocaleString()}</div>
                <div style="font-size:8px;color:var(--text-dim);margin-top:4px;font-weight:700">
                  FLOOR: $${FLOOR} · GOAL: $${GOAL}
                </div>
                <div style="margin-top:6px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden">
                  <div style="height:100%;width:${Math.min(Math.max((state.bankroll - FLOOR) / (GOAL - FLOOR), 0), 1) * 100}%;background:linear-gradient(90deg,var(--amber),var(--emerald));border-radius:2px;transition:width 0.3s"></div>
                </div>
              </div>
              <div class="hud-card">
                <div class="hud-label">P/L</div>
                <div class="hud-value small" style="color:${state.bankroll - STARTING_BANKROLL >= 0 ? 'var(--emerald)' : 'var(--red)'}">
                  ${state.bankroll - STARTING_BANKROLL >= 0 ? '+' : ''}$${state.bankroll - STARTING_BANKROLL}
                </div>
              </div>
              <div class="hud-card">
                <div class="hud-label">0/00 Gap</div>
                <div class="hud-value small" style="color:${state.spinsSinceZero >= 12 ? 'var(--red)' : 'var(--text-dim)'}">
                  ${state.spinsSinceZero}
                </div>
              </div>
              <div class="hud-card">
                <div class="hud-label">Lock Level</div>
                <div class="hud-value small" style="color:${state.profitLockLevel > 0 ? 'var(--amber)' : 'var(--text-dim)'}">
                  ${state.profitLockLevel}/4
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- NEXT BETS -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">📋 My Next Bets</span>
          </div>
          <div class="panel-body">
            ${state.smartPauseSpins > 0 ? `
              <div class="bet-row waiting">
                <span class="bet-label">⏸ SMART PAUSE</span>
                <span class="bet-amount amber">${state.smartPauseSpins} spins</span>
              </div>
            ` : nextBets.map(b => `
              <div class="bet-row ${b.cls}">
                <div>
                  <span class="bet-label">${b.label}</span>
                  ${b.note ? `<div style="font-size:7px;color:var(--text-dim);font-weight:700;margin-top:2px">${b.note}</div>` : ''}
                </div>
                <span class="bet-amount ${b.cls === 'active' ? 'green' : b.cls === 'waiting' ? 'amber' : ''}">${b.amount}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- SYSTEM RULES QUICK REF -->
        <div class="panel" style="opacity:0.6">
          <div class="panel-header">
            <span class="panel-label">System Rules</span>
          </div>
          <div class="panel-body" style="font-size:8px;color:var(--text-dim);line-height:1.6;font-weight:600">
            <div>▸ Pivot: Bet dozen after 4 misses</div>
            <div>▸ Progression: 5→5→5→10→15→25→40→65→105</div>
            <div>▸ One dozen progresses, other stays $5</div>
            <div>▸ Smart Pause: 2 both-dozen losses → wait 2</div>
            <div>▸ Snipes: $2 on #8 and #17</div>
            <div>▸ Zero Hedge: $1 on 0/00 after 12 spins</div>
            <div style="margin-top:6px;color:var(--amber)">LOCKS:</div>
            <div>▸ $1350 → Stop snipes</div>
            <div>▸ $1425 → Flat $2 all dozens</div>
            <div>▸ $1475 → Zero hedge only</div>
            <div>▸ $1500 → WALK</div>
          </div>
        </div>

      </div>
    </div>
  `;
}

// Override render to also draw sparkline after DOM update
const _origRender = render;
const patchedRender = function() {
  _origRender();
  requestAnimationFrame(() => drawSparkline());
};
// Replace all render references
window.render = patchedRender;

// Initial render
patchedRender();
</script>
</body>
</html>
