<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35 Crazy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1200px;
        }

        #ui {
            position: absolute;
            top: 20px;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, #cc0000, #880000);
            color: white;
            border: 2px solid #ff4444;
            border-radius: 8px;
            font-weight: bold;
        }

        /* The Roulette Wheel Container */
        #wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
            transform-style: preserve-3d;
            /* Normal 3D tilt for a roulette wheel */
            transform: rotateX(60deg) translateZ(0);
        }

        /* The actual wheel graphic */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #d32f2f 0 10deg, #111 10deg 20deg, 
                #d32f2f 20deg 30deg, #111 30deg 40deg,
                #d32f2f 40deg 50deg, #111 50deg 60deg,
                #388e3c 60deg 70deg, /* Green pocket */
                #111 70deg 80deg, #d32f2f 80deg 90deg,
                #111 90deg 100deg, #d32f2f 100deg 110deg,
                #111 110deg 120deg, #d32f2f 120deg 130deg,
                #111 130deg 140deg, #d32f2f 140deg 150deg,
                #111 150deg 160deg, #d32f2f 160deg 170deg,
                #111 170deg 180deg, #d32f2f 180deg 190deg,
                #111 190deg 200deg, #d32f2f 200deg 210deg,
                #111 210deg 220deg, #d32f2f 220deg 230deg,
                #111 230deg 240deg, #d32f2f 240deg 250deg,
                #111 250deg 260deg, #d32f2f 260deg 270deg,
                #111 270deg 280deg, #d32f2f 280deg 290deg,
                #111 290deg 300deg, #d32f2f 300deg 310deg,
                #111 310deg 320deg, #d32f2f 320deg 330deg,
                #111 330deg 340deg, #d32f2f 340deg 350deg,
                #111 350deg 360deg
            );
            border: 20px solid #5d4037; /* Wood rim */
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheel-inner {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #e0e0e0;
            background: radial-gradient(circle, #fff 0%, #b0b0b0 100%);
            border: 5px solid #ffca28; /* Gold turret */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Normal spinning animation */
        .spinning {
            animation: normalSpin 4s linear infinite;
        }

        @keyframes normalSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Crazy Derail Animation */
        .derail {
            /* Flip out of control and fall off screen */
            animation: flipCrazy 2.5s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        @keyframes flipCrazy {
            0% { 
                transform: rotateX(60deg) translateZ(0) rotateY(0) scale(1); 
            }
            20% {
                /* Pop up violently */
                transform: rotateX(10deg) translateZ(300px) rotateY(180deg) scale(1.2);
            }
            50% {
                /* Start falling and flipping wildly */
                transform: rotateX(-180deg) translateZ(100px) rotateY(540deg) translateY(300px) scale(0.8);
                opacity: 1;
            }
            100% {
                /* Completely off screen bottom */
                transform: rotateX(-360deg) translateZ(-500px) rotateY(1080deg) translateY(2000px) scale(0.2);
                opacity: 0;
            }
        }

        /* Bouncing Ball */
        #giant-ball {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #f4f4f4 40%, #a0a0a0 80%, #444 100%);
            border-radius: 50%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), inset -10px -10px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            font-weight: 900;
            color: #111;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transform: translate(-1000px, -1000px); /* Start way off screen */
        }

        .bounce-in {
            animation: ballBounceAround 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes ballBounceAround {
            0% {
                opacity: 1;
                transform: translate(-150vw, -100vh) scale(2) rotate(-360deg);
            }
            20% {
                /* Hits bottom edge and squishes */
                transform: translate(30vw, 40vh) scale(1, 0.8) rotate(-180deg);
            }
            25% {
                /* Bounces up */
                transform: translate(20vw, -30vh) scale(1.1, 1.1) rotate(-90deg);
            }
            45% {
                /* Hits top left edge */
                transform: translate(-40vw, -10vh) scale(0.8, 1) rotate(0deg);
            }
            50% {
                transform: translate(-20vw, 20vh) scale(1, 1) rotate(90deg);
            }
            70% {
                /* Hits right edge */
                transform: translate(40vw, 10vh) scale(0.8, 1) rotate(180deg);
            }
            100% {
                /* Settles exactly dead center */
                opacity: 1;
                transform: translate(0, 0) scale(1.5) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <button onclick="triggerCrazy35()">Trigger Crazy 35</button>
    </div>

    <!-- 3D Wheel Container -->
    <div id="wheel-container">
        <div id="wheel">
            <div id="wheel-inner"></div>
        </div>
    </div>

    <!-- The Giant Bouncing Ball -->
    <div id="giant-ball">
        35
    </div>

    <!-- Dummy Audio -->
    <audio id="spinSound" src="wheelspin.mp3" loop></audio>

    <script>
        const wheelContainer = document.getElementById('wheel-container');
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('giant-ball');
        const spinSound = document.getElementById('spinSound');

        // Start wheel spinning by default
        wheel.classList.add('spinning');

        function triggerCrazy35() {
            // 1. Play spin sound (simulating normal gameplay)
            spinSound.play().catch(e => console.log('Audio requires interaction'));

            // 2. Wait a bit, then TRIGGER the madness
            setTimeout(() => {
                // Record scratch / abruptly stop the sound
                spinSound.pause();
                
                // You could play a loud "CLUNK" or glass break here
                // let clunk = new Audio('clunk.mp3'); clunk.play();

                // 3. Stop normal CSS spin and lock its rotation
                const currentRotation = getComputedStyle(wheel).getPropertyValue('transform');
                wheel.style.transform = currentRotation; // freeze it
                wheel.classList.remove('spinning');

                // 4. Derail the entire container
                wheelContainer.classList.add('derail');

                // 5. Bring in the bouncing ball after the wheel clears out
                setTimeout(() => {
                    ball.classList.add('bounce-in');
                }, 1200); // 1.2s after derail starts

            }, 1000); // Trigger 1 second after click
        }
    </script>
</body>
</html>
