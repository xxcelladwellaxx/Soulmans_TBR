<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Realistic Roulette Wheel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            margin: 0;
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .scene {
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .roulette-wrapper {
            position: relative;
            width: 800px;
            height: 800px;
            transform-style: preserve-3d;
            transform: rotateX(55deg);
            transition: transform 0.5s ease-out;
        }

        .base-layer {
            position: absolute;
            top: 20px; 
            left: 20px;
            width: 760px; 
            height: 760px;
            border-radius: 50%;
            /* Wood texture fallback */
            background: center / cover url('wood.jpg'), #2c1509;
            transform: translateZ(-40px);
            box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.6);
            /* Outer metal ring */
            border: 8px solid #555;
        }

        .mid-layer {
            position: absolute;
            top: 20px; 
            left: 20px;
            width: 760px; 
            height: 760px;
            border-radius: 50%;
            background-color: #1a0803;
            transform: translateZ(-20px);
        }

        canvas {
            position: absolute;
            top: 0; 
            left: 0;
            transform: translateZ(0px); /* Top Layer */
            filter: drop-shadow(0 20px 20px rgba(0,0,0,0.8));
        }

        .ui-container {
            position: absolute;
            bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spin-btn {
            padding: 15px 50px;
            font-size: 28px;
            border-radius: 50px;
            background: linear-gradient(145deg, #e6b800 0%, #b38f00 100%);
            color: #111;
            border: none;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }

        .spin-btn:hover {
            filter: brightness(1.1);
        }

        .spin-btn:active {
            transform: translateY(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2);
        }

        .spin-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .winner-display {
            position: absolute;
            top: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            transition: opacity 0.5s calc(var(--delay) * 1s), transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .winner-display.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .winner-number {
            font-size: 120px;
            font-weight: 900;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.5);
            line-height: 1;
            padding: 20px 40px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .red-num { color: #ff3333; }
        .black-num { color: #aaaaaa; }
        .green-num { color: #00e600; }

        .winner-label {
            font-size: 24px;
            margin-bottom: -10px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="winner-display" id="winnerDisplay">
        <div class="winner-label">WINNING NUMBER</div>
        <div class="winner-number" id="winnerNumber">00</div>
    </div>

    <div class="scene">
        <div class="roulette-wrapper" id="wheelWrapper">
            <div class="base-layer"></div>
            <div class="mid-layer"></div>
            <canvas id="wheelCanvas"></canvas>
        </div>
    </div>

    <div class="ui-container">
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
    </div>

    <!-- Background Wheel Audio -->
    <audio id="spinAudio" src="wheel.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;

        // American Roulette Sequence
        const NUMBERS = ["0", "28", "9", "26", "30", "11", "7", "20", "32", "17", "5", "22", "34", "15", "3", "24", "36", "13", "1", "00", "27", "10", "25", "29", "12", "8", "19", "31", "18", "6", "21", "33", "16", "4", "23", "35", "14", "2"];
        const COLORS = { "0": "green", "00": "green" };
        [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36].forEach(n => COLORS[n.toString()] = "red");
        [2, 4, 6, 8, 10, 11, 13, 15, 17, 20, 22, 24, 26, 28, 29, 31, 33, 35].forEach(n => COLORS[n.toString()] = "black");

        const cx = 400, cy = 400;
        const RADIUS_OUTER = 380; // Total size
        const RADIUS_TRACK = 340; // Track where ball rolls
        const RADIUS_SLOTS_OUTER = 250; // Outer edge of numbered slots
        const RADIUS_SLOTS_INNER = 160; // Inner edge of numbered slots
        const RADIUS_DOME = 130;  // Center dome
        const RADIUS_TURRET = 100; // Shiny turret center
        const POCKET_ARC = (Math.PI * 2) / NUMBERS.length;

        let wheelInfo = { angle: 0, velocity: 0 };
        // Initial state: ball is resting in pocket 0
        let ballInfo = { angle: POCKET_ARC/2, velocity: 0, radius: RADIUS_SLOTS_INNER + 45, state: 'idle', lockedPocket: 0 }; 
        let spinAudio = document.getElementById('spinAudio');
        let isSpinning = false;

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            // Hide winner
            document.getElementById('winnerDisplay').classList.remove('show');

            // Add dynamic CSS wobble to make it feel alive!
            document.getElementById('wheelWrapper').style.transition = 'transform 0.1s linear';

            // Randomize spin strengths
            wheelInfo.velocity = 0.04 + Math.random() * 0.02; // Rads per frame (~2.5 degrees)
            ballInfo.velocity = -(0.06 + Math.random() * 0.03); // Spins opposite direction
            ballInfo.radius = RADIUS_TRACK; // Move ball to outer track
            ballInfo.state = 'spinning';
            ballInfo.lockedPocket = -1;

            try {
                spinAudio.currentTime = 0;
                spinAudio.volume = 0.7; // Ensure volume is up
                spinAudio.play();
            } catch (e) {
                console.log("Audio play failed (maybe autoplay blocked?): ", e);
            }

            requestAnimationFrame(updatePhysics);
        }

        // We use requestAnimationFrame to animate and drive physics
        let bounceCount = 0;
        let lastFrameTime = performance.now();

        function updatePhysics(time) {
            let dt = (time - lastFrameTime) / 16.66; // Normalize to 60fps roughly
            if (dt > 2) dt = 2; // cap large spikes
            lastFrameTime = time;

            // Update wheel rotation
            wheelInfo.angle += wheelInfo.velocity * dt;
            // Constant friction for wheel
            wheelInfo.velocity *= Math.pow(0.9985, dt);

            if (ballInfo.state === 'idle') {
                drawWheel();
                return;
            }

            // Small wobble effect on the CSS transform based on wheel velocity
            if (wheelInfo.velocity > 0.01) {
                let wobbleX = 55 + Math.sin(time/50) * 0.5 * (wheelInfo.velocity * 20);
                let wobbleY = Math.cos(time/40) * 0.5 * (wheelInfo.velocity * 20);
                document.getElementById('wheelWrapper').style.transform = `rotateX(${wobbleX}deg) rotateY(${wobbleY}deg)`;
            } else {
                document.getElementById('wheelWrapper').style.transform = `rotateX(55deg)`;
            }

            // Update Ball rotation
            ballInfo.angle += ballInfo.velocity * dt;

            // Physics states
            if (ballInfo.state === 'spinning') {
                ballInfo.velocity *= Math.pow(0.993, dt); // Ball friction
                
                // Centripetal force loss
                if (Math.abs(ballInfo.velocity) < 0.038) {
                    ballInfo.state = 'decaying';
                }
            } else if (ballInfo.state === 'decaying') {
                ballInfo.velocity *= Math.pow(0.991, dt); // More friction while falling
                ballInfo.radius -= 2.5 * dt; // Stronger gravity pulls inward down the steep bowl
                
                // Diamond Deflector Collision (8 deflectors at RADIUS 290, angles at multiples of PI/4)
                if (ballInfo.radius > 280 && ballInfo.radius < 300) {
                    let globalAngle = ballInfo.angle % (Math.PI * 2);
                    if (globalAngle < 0) globalAngle += Math.PI * 2;
                    let deflectorMod = globalAngle % (Math.PI / 4);
                    
                    // Direct hit on a diamond!
                    if (deflectorMod < 0.08 || deflectorMod > (Math.PI / 4) - 0.08) {
                        bounceCount++;
                        // Scatter ball: reverse or severely dampen velocity
                        ballInfo.velocity = -ballInfo.velocity * 0.5 + (Math.random() - 0.5) * 0.06;
                        // Bump randomly (outwards or inwards)
                        ballInfo.radius += (Math.random() - 0.2) * 5;
                        // Shift angle slightly to simulate erratic bounce
                        ballInfo.angle += (Math.random() - 0.5) * 0.04;
                    }
                }
                
                // Hit the fret zone
                if (ballInfo.radius <= RADIUS_SLOTS_OUTER + 5) {
                    ballInfo.state = 'bouncing';
                    bounceCount = 0;
                }
            } else if (ballInfo.state === 'bouncing') {
                // Ball hits the frets and interacts with wheel velocity
                let relAngle = (ballInfo.angle - wheelInfo.angle + Math.PI * 100) % (Math.PI * 2);
                let pocketMod = relAngle % POCKET_ARC;
                
                ballInfo.radius -= 1.2 * dt; // Continued gravity in slots

                // Is it touching a fret separator?
                if (pocketMod < 0.08 || pocketMod > POCKET_ARC - 0.08) {
                    // Bounce
                    bounceCount++;
                    // Mix wheel velocity and random scatter
                    ballInfo.velocity = wheelInfo.velocity * 0.7 + (Math.random() - 0.5) * 0.08;
                    // Push out slightly, but not too far
                    ballInfo.radius += 2 + Math.random() * 5;
                }

                // HARD LIMIT: The bowl wall prevents the ball from flying back up the slope completely
                if (ballInfo.radius > RADIUS_SLOTS_OUTER + 15) {
                    ballInfo.radius = RADIUS_SLOTS_OUTER + 15;
                    ballInfo.velocity *= 0.8; // Lose energy hitting the outer wall bounds
                }

                // Drag from slots spinning
                // Moves ball velocity slowly toward wheel velocity
                ballInfo.velocity = ballInfo.velocity * 0.9 + wheelInfo.velocity * 0.1;

                // Stop bouncing once deep enough inside the slot (hitting the center pocket wall)
                if (ballInfo.radius <= RADIUS_SLOTS_INNER + 45) {
                    ballInfo.radius = RADIUS_SLOTS_INNER + 45;
                    
                    if (Math.abs(ballInfo.velocity - wheelInfo.velocity) < 0.01 || bounceCount > 15) {
                        ballInfo.state = 'settled';
                        // Lock to nearest pocket
                        ballInfo.lockedPocket = Math.floor(relAngle / POCKET_ARC);
                    }
                }
            } else if (ballInfo.state === 'settled') {
                // Lock ball to wheel via smooth easing
                let targetAngle = wheelInfo.angle + ballInfo.lockedPocket * POCKET_ARC + POCKET_ARC / 2;
                
                // Calculate shortest angular distance
                let angleDiff = targetAngle - ballInfo.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                // Ease the ball into the exact center of the pocket
                ballInfo.angle += angleDiff * 0.1 * dt;
                ballInfo.velocity = wheelInfo.velocity;
                
                if (Math.abs(wheelInfo.velocity) < 0.0001) {
                    // STOP SPINNING entirely
                    wheelInfo.velocity = 0;
                    ballInfo.state = 'idle';
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    // WINNER SELECTION
                    const winningNumber = NUMBERS[ballInfo.lockedPocket]; 
                    showWinner(winningNumber);
                    
                    // Fade out audio realistically
                    let vol = spinAudio.volume;
                    let fadeOut = setInterval(() => {
                        vol -= 0.05;
                        if(vol <= 0) {
                            clearInterval(fadeOut);
                            spinAudio.pause();
                            spinAudio.volume = 0.7; // reset
                        } else {
                            spinAudio.volume = vol;
                        }
                    }, 100);
                }
            }

            // Render loop
            drawWheel();

            if (ballInfo.state !== 'idle') {
                requestAnimationFrame(updatePhysics);
            }
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ================= STATIONARY OUTER BASE =================
            ctx.save();
            ctx.translate(cx, cy);

            // Inner dark wood bevel
            ctx.beginPath();
            ctx.arc(0, 0, RADIUS_OUTER, 0, Math.PI * 2);
            let rimGradient = ctx.createRadialGradient(0, 0, RADIUS_OUTER - 40, 0, 0, RADIUS_OUTER);
            rimGradient.addColorStop(0, '#2e1306');
            rimGradient.addColorStop(1, '#4a2512');
            ctx.fillStyle = rimGradient;
            ctx.fill();

            // The Sloped Bowl (Gradient from slots up to track)
            ctx.beginPath();
            ctx.arc(0, 0, RADIUS_TRACK, 0, Math.PI * 2);
            let bowlGrad = ctx.createRadialGradient(0, 0, RADIUS_SLOTS_OUTER, 0, 0, RADIUS_TRACK);
            bowlGrad.addColorStop(0, '#0a0a0a'); // Deep dark shadow where it hits the metal slots
            bowlGrad.addColorStop(0.3, '#1a0a03'); 
            bowlGrad.addColorStop(0.8, '#2e1306'); // Middle of slope
            bowlGrad.addColorStop(1, '#3b1c0b'); // Top of slope meets track
            ctx.fillStyle = bowlGrad;
            ctx.fill();

            // Diamond deflector stops (track decorations - stationary on the slope)
            const RADIUS_DEFLECTORS = 290;
            ctx.fillStyle = '#bfa145'; // Brass
            for(let d=0; d<8; d++) {
                ctx.save();
                ctx.rotate((Math.PI * 2) / 8 * d); // Even spaces
                ctx.beginPath();
                // Diamond shape
                ctx.moveTo(RADIUS_DEFLECTORS, -6);
                ctx.lineTo(RADIUS_DEFLECTORS + 12, 0);
                ctx.lineTo(RADIUS_DEFLECTORS, 6);
                ctx.lineTo(RADIUS_DEFLECTORS - 12, 0);
                ctx.fill();
                
                // Add tiny highlight for 3D brass look
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.moveTo(RADIUS_DEFLECTORS, -6);
                ctx.lineTo(RADIUS_DEFLECTORS, 0);
                ctx.lineTo(RADIUS_DEFLECTORS - 12, 0);
                ctx.fill();
                ctx.fillStyle = '#bfa145';

                ctx.restore();
            }

            // ================= ROTATING INNER WHEEL =================
            ctx.rotate(wheelInfo.angle);


            // ================= NUMBER SLOTS =================
            ctx.font = "bold 20px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let i = 0; i < NUMBERS.length; i++) {
                let startAngle = i * POCKET_ARC;
                let endAngle = (i + 1) * POCKET_ARC;
                
                // Draw Pocket Background
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, RADIUS_SLOTS_OUTER, startAngle, endAngle);
                
                // Colorize
                let c = COLORS[NUMBERS[i]];
                if (c === "red") {
                    let grad = ctx.createRadialGradient(0,0,RADIUS_SLOTS_INNER, 0,0,RADIUS_SLOTS_OUTER);
                    grad.addColorStop(0, '#7a0000');
                    grad.addColorStop(1, '#cc0000');
                    ctx.fillStyle = grad;
                } else if (c === "black") {
                    let grad = ctx.createRadialGradient(0,0,RADIUS_SLOTS_INNER, 0,0,RADIUS_SLOTS_OUTER);
                    grad.addColorStop(0, '#0a0a0a');
                    grad.addColorStop(1, '#222222');
                    ctx.fillStyle = grad;
                } else { // Green
                    let grad = ctx.createRadialGradient(0,0,RADIUS_SLOTS_INNER, 0,0,RADIUS_SLOTS_OUTER);
                    grad.addColorStop(0, '#004d00');
                    grad.addColorStop(1, '#009900');
                    ctx.fillStyle = grad;
                }
                ctx.fill();

                // Draw Chrome Dividers (Frets)
                ctx.beginPath();
                // Move slightly past inner radius so it blends
                ctx.moveTo(Math.cos(startAngle) * (RADIUS_SLOTS_INNER - 5), Math.sin(startAngle) * (RADIUS_SLOTS_INNER - 5));
                ctx.lineTo(Math.cos(startAngle) * (RADIUS_SLOTS_OUTER + 2), Math.sin(startAngle) * (RADIUS_SLOTS_OUTER + 2));
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Fake fret highlight/shadow for 3D look
                ctx.beginPath();
                ctx.moveTo(Math.cos(startAngle + 0.01) * RADIUS_SLOTS_INNER, Math.sin(startAngle + 0.01) * RADIUS_SLOTS_INNER);
                ctx.lineTo(Math.cos(startAngle + 0.01) * RADIUS_SLOTS_OUTER, Math.sin(startAngle + 0.01) * RADIUS_SLOTS_OUTER);
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Inner Pocket Base (Where ball sits)
                ctx.beginPath();
                ctx.arc(0, 0, RADIUS_SLOTS_INNER + 20, startAngle, endAngle);
                ctx.lineWidth = 40;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; // Shadowy rim 
                ctx.stroke();

                // Draw Text
                let textAngle = startAngle + POCKET_ARC / 2;
                ctx.save();
                ctx.rotate(textAngle);
                ctx.translate(RADIUS_SLOTS_OUTER - 32, 0); // Position from center
                ctx.rotate(Math.PI / 2); // Point letters inward
                ctx.fillStyle = '#fff';
                // Small text shadow for legibility
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.shadowBlur = 2;
                ctx.fillText(NUMBERS[i], 0, 0);
                ctx.restore();
            }

            // ================= CENTER DOME & TURRET =================
            // Dark base dome
            ctx.beginPath();
            ctx.arc(0, 0, RADIUS_SLOTS_INNER, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();

            // Brass inner ring
            ctx.beginPath();
            ctx.arc(0, 0, RADIUS_DOME, 0, Math.PI * 2);
            let domeGrad = ctx.createRadialGradient(0,0,0, 0,0,RADIUS_DOME);
            domeGrad.addColorStop(0.8, '#d4af37'); // Gold
            domeGrad.addColorStop(1, '#665318');
            ctx.fillStyle = domeGrad;
            ctx.fill();
            
            // Turret Base
            ctx.beginPath();
            ctx.arc(0, 0, RADIUS_TURRET, 0, Math.PI * 2);
            let turGrad = ctx.createRadialGradient(-30, -30, 10, 0, 0, RADIUS_TURRET);
            turGrad.addColorStop(0, '#ffffff'); // Shiny highlight
            turGrad.addColorStop(0.3, '#bbbbbb');
            turGrad.addColorStop(1, '#444444');
            ctx.fillStyle = turGrad;
            ctx.fill();

            // Turret Spider (4 arms)
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            for(let j=0; j<4; j++) {
                ctx.rotate(Math.PI / 2);
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(RADIUS_TURRET - 15, 0);
                
                // Nice metallic effect on arms
                let armGrad = ctx.createLinearGradient(0, -10, 0, 10);
                armGrad.addColorStop(0, '#aaa');
                armGrad.addColorStop(0.5, '#eee');
                armGrad.addColorStop(1, '#777');
                ctx.strokeStyle = armGrad;
                ctx.stroke();

                // Arm shadows
                ctx.beginPath();
                ctx.moveTo(10, 5);
                ctx.lineTo(RADIUS_TURRET - 15, 5);
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Center Pin
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#d4af37';
            ctx.fill();

            ctx.restore();

            // ================= THE BALL =================
            // Drawn in global space, independent of wheel rotation!
            if (ballInfo.state !== 'idle' || ballInfo.state === 'idle' /* Always visible */) {
                let bx = cx + Math.cos(ballInfo.angle) * ballInfo.radius;
                let by = cy + Math.sin(ballInfo.angle) * ballInfo.radius;
                
                // Because CSS rotates the canvas X by 55deg, the ball gets squashed vertically.
                // We draw it as a circle, and let CSS handle the perspective squeeze.
                ctx.beginPath();
                ctx.arc(bx, by, 12, 0, Math.PI * 2);
                
                // Ball gradient matching light source
                // Light from top left in canvas space
                let ballGrad = ctx.createRadialGradient(bx - 4, by - 4, 2, bx, by, 12);
                ballGrad.addColorStop(0, '#ffffff'); // intense highlight
                ballGrad.addColorStop(0.3, '#f0f0f0');
                ballGrad.addColorStop(0.8, '#999999');
                ballGrad.addColorStop(1, '#555555'); 
                
                ctx.fillStyle = ballGrad;
                
                // Ball drop shadow onto the wheel
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 6;
                ctx.shadowOffsetY = 6;
                ctx.fill();
                
                ctx.shadowColor = 'transparent'; // reset shadow
            }
        }

        function showWinner(numStr) {
            const display = document.getElementById('winnerDisplay');
            const numEl = document.getElementById('winnerNumber');
            
            numEl.textContent = numStr;
            // Clean up old classes
            numEl.className = "winner-number"; 
            
            if (c === "red") {
                numEl.classList.add("red-num");
                numEl.style.background = 'rgba(0, 0, 0, 0.6)';
                numEl.style.border = '2px solid rgba(255,255,255,0.1)';
            }
            else if (c === "black") {
                numEl.classList.add("black-num");
                numEl.style.background = 'rgba(0, 0, 0, 0.6)';
                numEl.style.border = '2px solid rgba(255,255,255,0.1)';
            }
            else {
                numEl.classList.add("green-num");
                numEl.style.background = 'linear-gradient(135deg, #004d00, #00b300)';
                numEl.style.border = '4px solid #00ffaa';
            }

            display.classList.add('show');
        }

        // Initial draw on load
        window.onload = () => {
            drawWheel(); 
        };
    </script>
</body>
</html>
